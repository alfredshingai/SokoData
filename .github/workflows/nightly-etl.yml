name: Nightly ETL (All Countries)

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country ISO3 codes (e.g., ZW,KE)"
        required: false
        default: "ZW,KE"

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[pdf]"

      - name: Run markets ETL for all configured African countries
        env:
          SOKODATA_DATA_DIR: ${{ runner.temp }}/sokodata
        run: |
          python -m sokodata.etl_run --all-countries

      - name: Run full commons ETL for primary countries
        if: success() || failure()
        env:
          SOKODATA_DATA_DIR: ${{ runner.temp }}/sokodata
        run: |
          python -m sokodata.etl_run --country ZW --only economy,climate,demographics,agriculture,health,education,energy,water,transport,mining,governance,trade,labour,environment,poverty,ict,finance,tourism,aid,gender,geospatial,indicators
          python -m sokodata.etl_run --country KE --only economy,climate,demographics,agriculture,health,education,energy,water,transport,mining,governance,trade,labour,environment,poverty,ict,finance,tourism,aid,gender,geospatial,indicators

      - name: Deploy to Render (trigger rebuild)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}"
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}