name: Nightly ETL (All Countries)

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country ISO3 codes (e.g., ZW,KE)"
        required: false
        default: "ZW,KE"

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[pdf]"

      - name: Run ETL for all countries
        env:
          SOKODATA_DATA_DIR: ${{ runner.temp }}/sokodata
        run: |
          python -m sokodata.etl_run --country ZW
          python -m sokodata.etl_run --country KE

      - name: Deploy to Render (trigger rebuild)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}"
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}