[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokodata"
version = "0.1.0"
description = "Open market-price intelligence for African food markets. Starts with Zimbabwe, built on WFP/HDX open data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alfred Shingai" }]
requires-python = ">=3.12"
keywords = ["food-prices", "open-data", "zimbabwe", "wfp", "markets", "agriculture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/alfredshingai/sokodata"
Issues = "https://github.com/alfredshingai/sokodata/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Query()/Path() in defaults is the framework's idiom, not a bug.
"src/sokodata/api/routers/*" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
